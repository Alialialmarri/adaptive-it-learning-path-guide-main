<div class="dashboard-container">
  <div class="header">
    @if (user) {
      <h2>Welcome, {{ user.username }}</h2>
    }
    @if (!user) {
      <h2>Welcome</h2>
    }
  </div>
  <div class="content-row">
    <div class="track-map-panel">
      <app-track-map></app-track-map>
    </div>
    <div class="chat-panel">
      <app-chat-interface></app-chat-interface>
    </div>
  </div>
</div>
